<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>PS4 Cast</title>
<style>html,body{margin:0;padding:0;background:#000;height:100%;width:100%;overflow:hidden}
video{position:fixed;top:0;left:0;width:100vw;height:100vh;object-fit:contain;background:#000}
#m{position:fixed;top:46%;width:100%;text-align:center;color:#6cf;font:20px sans-serif}</style></head>
<body><div id="m">loading…</div>
<video id="v" autoplay playsinline webkit-playsinline controls></video>
<script>
var q=new URLSearchParams(location.search),src=q.get('v'),v=document.getElementById('v'),m=document.getElementById('m');
function play(){v.play().then(function(){m.style.display='none'}).catch(function(){m.textContent='press X / OK to play'})}
if(src){v.src=decodeURIComponent(src);
v.addEventListener('loadeddata',play);v.addEventListener('canplay',play);
v.addEventListener('playing',function(){m.style.display='none'});
v.addEventListener('error',function(){m.textContent='video error (code '+(v.error&&v.error.code)+')'});
play();}else{m.textContent='no ?v=';}
document.addEventListener('click',play);document.addEventListener('keydown',play);
</script></body></html>
