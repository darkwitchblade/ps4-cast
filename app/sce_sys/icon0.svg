<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2547"/>
      <stop offset="0.55" stop-color="#0e1730"/>
      <stop offset="1" stop-color="#070b18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.62">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fa3ff"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- full square background, no rounded corners -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- screen (enlarged + centered) -->
  <g transform="translate(86,116)">
    <rect x="0" y="0" width="340" height="222" rx="26" fill="#0b1224" stroke="#2f3c72" stroke-width="7"/>
    <rect x="20" y="20" width="300" height="182" rx="14" fill="#0a1834"/>
    <!-- play -->
    <path d="M168 86 L168 136 L212 111 Z" fill="url(#accent)"/>
    <!-- cast waves, bottom-left -->
    <g fill="none" stroke="#5fa3ff" stroke-width="13" stroke-linecap="round">
      <circle cx="50" cy="172" r="10" fill="#5fa3ff" stroke="none"/>
      <path d="M50 142 a30 30 0 0 1 30 30"/>
      <path d="M50 112 a60 60 0 0 1 60 60"/>
    </g>
  </g>

  <!-- stand -->
  <rect x="236" y="350" width="40" height="26" rx="6" fill="#2f3c72"/>
  <rect x="198" y="372" width="116" height="14" rx="7" fill="#2f3c72"/>
</svg>
